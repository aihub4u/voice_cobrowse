<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3FC;
    --card: #FFFFFF;
    --ink: #171B2E;
    --ink-soft: #6B7280;
    --line: #E3E9F7;
    --primary: #2874F0;
    --primary-dark: #1955C4;
    --primary-bg: #E8F0FE;
    --primary-glow: rgba(40, 116, 240, 0.35);
    --accent: #FFC200;
    --accent-ink: #7A4E00;
    --accent-bg: #FFF7DE;
    --live: #00B562;
    --shadow: 0 1px 2px rgba(23,27,46,0.05), 0 8px 20px rgba(40,116,240,0.08);
    --bar-h: 68px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(40,116,240,0.10), transparent 45%);
    color: var(--ink); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 480px; margin: 0 auto; position: relative;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(135deg, var(--primary) 0%, #1E5FD9 100%);
    box-shadow: 0 4px 18px var(--primary-glow);
  }
  .topbar .mark {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; color: #fff;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar .mark .spark { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.85); }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.5);
    transition: background 0.3s;
  }
  .status.live .dot {
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(0,181,98,0.6);
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(0,181,98,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(0,181,98,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,181,98,0); }
  }

  .scroll-area {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 14px calc(var(--bar-h) + 16px);
  }

  /* --- Offer chip --- */
  .offer-chip {
    display: none; align-items: center; gap: 7px;
    background: linear-gradient(90deg, var(--accent-bg), #FFF);
    border: 1px solid #FFE28A;
    border-radius: 11px; padding: 8px 12px; margin-bottom: 10px;
    font-size: 12.5px; font-weight: 500; color: var(--accent-ink);
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  /* --- Collapsible cart summary --- */
  .cart-summary {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    margin-bottom: 12px; overflow: hidden; border: 1px solid var(--line);
  }
  .cart-summary-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .cart-summary-head .label { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px; }
  .cart-summary-head .meta { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .cart-summary-head .chev { transition: transform 0.25s ease; font-size: 11px; }
  .cart-summary.open .chev { transform: rotate(180deg); }

  .cart-detail { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .cart-summary.open .cart-detail { max-height: 240px; overflow-y: auto; }
  .cart-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 12px; border-top: 1px solid var(--line);
    transition: background 0.3s;
  }
  .cart-row.pulse { background: var(--primary-bg); }
  .cart-row .thumb { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; background: var(--line); flex-shrink: 0; }
  .cart-row .name { font-size: 13px; font-weight: 500; }
  .cart-row .meta { font-size: 11.5px; color: var(--ink-soft); }
  .cart-row .price {
    margin-left: auto; font-family: 'Sora', sans-serif; font-weight: 600;
    font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap;
  }
  .empty-note { color: var(--ink-soft); font-size: 13px; padding: 2px 0 8px; }

  /* --- Product list --- */
  h2.section {
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13.5px;
    margin: 4px 0 8px;
  }
  .plist { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
  .prow {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-top: 1px solid var(--line);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .prow:first-child { border-top: none; }
  .prow.spot {
    background: var(--primary-bg);
    box-shadow: inset 3px 0 0 var(--primary), 0 0 14px var(--primary-glow);
  }
  .prow .thumb { width: 34px; height: 34px; border-radius: 7px; object-fit: cover; background: var(--line); flex-shrink: 0; }
  .prow .name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
  .prow .price {
    font-family: 'Sora', sans-serif; font-weight: 600; font-size: 13px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* --- Floating cart summary bar (display-only, glass HUD style) --- */
  .cart-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    display: none; height: var(--bar-h);
    background: linear-gradient(135deg, rgba(23,27,46,0.92), rgba(25,85,196,0.92));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #fff;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .cart-bar.show { display: flex; align-items: center; }
  .cart-bar-inner { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .cart-bar .summary { font-size: 12px; color: rgba(255,255,255,0.75); }
  .cart-bar .summary .amt {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; color: var(--accent);
    font-variant-numeric: tabular-nums; display: block;
  }
  .cart-bar .hint { font-size: 11.5px; color: rgba(255,255,255,0.55); }

  /* --- Locked / confirmation / expired --- */
  .lock-screen { text-align: center; padding-top: 15vh; }
  .lock-mark {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; font-size: 24px;
  }
  .lock-mark.ok { background: var(--primary-bg); color: var(--primary); box-shadow: 0 0 24px var(--primary-glow); }
  .lock-mark.gone { background: var(--accent-bg); color: var(--accent-ink); }
  .lock-screen h1 { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 8px; }
  .lock-screen p { color: var(--ink-soft); font-size: 13.5px; margin: 0; }
  .lock-screen .order-id {
    display: inline-block; margin-top: 14px; background: var(--card); border-radius: 8px;
    padding: 8px 14px; font-family: 'Sora', sans-serif; font-weight: 600;
    font-size: 12.5px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums;
    border: 1px solid var(--line);
  }
</style>
</head>
<body>
  <div class="shell" id="app">
    <div class="topbar">
      <span class="mark"><span class="spark">&#9889;</span>Order</span>
      <span class="status" id="status"><span class="dot"></span><span id="status-text">connecting</span></span>
    </div>

    <div class="scroll-area">
      <div class="offer-chip" id="offer-chip"><span>&#127991;</span><span id="offer-text"></span></div>

      <div class="cart-summary" id="cart-summary">
        <div class="cart-summary-head" id="cart-summary-head">
          <span class="label">Your order</span>
          <span class="meta"><span id="cart-summary-text">No items yet</span><span class="chev">&#9662;</span></span>
        </div>
        <div class="cart-detail" id="cart-detail"></div>
      </div>

      <h2 class="section">Available products</h2>
      <div class="plist" id="products"></div>
    </div>

    <div class="cart-bar" id="cart-bar">
      <div class="cart-bar-inner">
        <div class="summary"><span id="bar-count">0 items</span><span class="amt" id="bar-total">₹0</span></div>
        <span class="hint">Managed by your agent</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('s');
    const API_BASE = '';
    const PLACEHOLDER_THUMB = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#E3E9F7"/></svg>'
    );

    const socket = io(API_BASE, { query: { session_id: sessionId } });
    let cart = {};
    let products = [];
    let locked = false;
    let expiryTimer = null;

    function formatINR(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
    function cartCount() { return Object.values(cart).reduce((s, i) => s + i.qty, 0); }
    function cartTotal() { return Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0); }

    function thumbTag(imageUrl, cls) {
      const src = imageUrl || PLACEHOLDER_THUMB;
      return `<img class="thumb ${cls || ''}" src="${src}" onerror="this.src='${PLACEHOLDER_THUMB}'" alt="">`;
    }

    function updateCartBar() {
      const count = cartCount();
      document.getElementById('cart-bar').classList.toggle('show', count > 0);
      document.getElementById('bar-count').textContent = `${count} item${count === 1 ? '' : 's'}`;
      document.getElementById('bar-total').textContent = formatINR(cartTotal());
    }

    function renderCart() {
      const entries = Object.entries(cart);
      const count = cartCount();
      document.getElementById('cart-summary-text').textContent = entries.length
        ? `${count} item${count === 1 ? '' : 's'} · ${formatINR(cartTotal())}`
        : 'No items yet';

      const detail = document.getElementById('cart-detail');
      detail.innerHTML = entries.length
        ? entries.map(([sku, item]) => `
            <div class="cart-row" id="cart-${sku}">
              ${thumbTag(item.image_url)}
              <div><div class="name">${item.product_name}</div><div class="meta">qty ${item.qty}</div></div>
              <div class="price">${formatINR(item.price * item.qty)}</div>
            </div>
          `).join('')
        : '<div class="empty-note" style="padding-left:12px">Items appear here as the agent talks you through your order.</div>';

      updateCartBar();
    }

    function renderProducts() {
      const el = document.getElementById('products');
      el.innerHTML = products.length
        ? products.map((p) => `
            <div class="prow" id="prod-${p.id}">
              ${thumbTag(p.image_url)}
              <div class="name">${p.name}</div>
              <div class="price">${formatINR(p.price)}</div>
            </div>
          `).join('')
        : '<div class="empty-note" style="padding:10px 12px">No products loaded yet.</div>';
    }

    function showLockScreen({ kind, message, orderId }) {
      locked = true;
      if (expiryTimer) clearTimeout(expiryTimer);
      const isOk = kind === 'completed';
      document.getElementById('app').innerHTML = `
        <div class="lock-screen">
          <div class="lock-mark ${isOk ? 'ok' : 'gone'}">${isOk ? '&#10003;' : '&#10005;'}</div>
          <h1>${isOk ? 'Order confirmed' : 'This link is no longer active'}</h1>
          <p>${message}</p>
          ${orderId ? `<div class="order-id">${orderId}</div>` : ''}
        </div>
      `;
    }

    async function loadState() {
      const res = await fetch(`${API_BASE}/session/${sessionId}/state`);

      if (res.status === 404) {
        showLockScreen({ kind: 'expired', message: 'This session has expired or does not exist.' });
        return;
      }

      const state = await res.json();

      if (state.status === 'completed') {
        showLockScreen({ kind: 'completed', message: 'This order has already been placed.', orderId: state.orderId });
        return;
      }

      cart = state.cart || {};
      products = state.products || [];
      renderCart();
      renderProducts();
      document.getElementById('status').classList.add('live');
      document.getElementById('status-text').textContent = 'live';

      if (expiryTimer) clearTimeout(expiryTimer);
      if (state.expiresAt) {
        const msLeft = state.expiresAt - Date.now();
        if (msLeft <= 0) {
          showLockScreen({ kind: 'expired', message: 'This session has expired.' });
        } else {
          expiryTimer = setTimeout(() => showLockScreen({ kind: 'expired', message: 'This session has expired.' }), msLeft);
        }
      }
    }

    socket.on('connect', loadState);
    socket.on('disconnect', () => {
      if (locked) return;
      document.getElementById('status').classList.remove('live');
      document.getElementById('status-text').textContent = 'reconnecting';
    });

    socket.on('cart:update', (data) => {
      if (locked) return;
      cart = data.cart;
      renderCart();
      const el = document.getElementById(`cart-${data.changed_sku}`);
      if (el) {
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 1200);
      }
    });

    socket.on('products:update', (data) => {
      if (locked) return;
      products = [...products, ...data.products];
      renderProducts();
    });

    socket.on('spotlight', (data) => {
      if (locked) return;
      const el = document.getElementById(`prod-${data.product_id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('spot');
        setTimeout(() => el.classList.remove('spot'), 1600);
      }
    });

    socket.on('offer:show', (data) => {
      if (locked) return;
      document.getElementById('offer-text').textContent = `${data.offer.title} — ${data.offer.discount}`;
      document.getElementById('offer-chip').style.display = 'flex';
    });

    socket.on('checkout:complete', (data) => {
      showLockScreen({ kind: 'completed', message: 'This order has already been placed.', orderId: data.order_id });
    });

    document.getElementById('cart-summary-head').addEventListener('click', () => {
      if (cartCount() === 0) return;
      document.getElementById('cart-summary').classList.toggle('open');
    });
  </script>
</body>
</html>
