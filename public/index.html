<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F1EA;
    --paper-raised: #FBFAF6;
    --ink: #20242B;
    --ink-soft: #63605A;
    --line: #D7D2C4;
    --primary: #24345C;
    --primary-ink: #FFFFFF;
    --amber: #B8791A;
    --amber-bg: #F7EAD2;
    --sage: #3F6B4A;
    --sage-bg: #E4EDE6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 48px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .mark {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px;
    letter-spacing: 0.01em;
  }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #B8791A;
    transition: background 0.3s;
  }
  .status.live .dot { background: var(--sage); }

  .total-block { margin-bottom: 28px; }
  .total-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .total-value {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600;
    font-size: 40px; line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.25s ease;
  }
  .total-value.tally { transform: scale(1.05); color: var(--primary); }

  h2.section {
    font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 15px;
    margin: 0 0 10px;
  }

  .ledger { border-top: 1px solid var(--line); margin-bottom: 28px; }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    background: transparent;
    transition: background 0.3s, border-color 0.3s;
  }
  .row-media { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .thumb {
    width: 42px; height: 42px; border-radius: 5px; object-fit: cover;
    background: var(--line); flex-shrink: 0;
  }
  .row .name { font-size: 14.5px; }
  .row .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .row .price {
    font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; padding-left: 10px;
  }
  .row.empty { color: var(--ink-soft); font-size: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }

  .row.pulse { background: var(--sage-bg); }
  .row.spot { background: var(--amber-bg); border-color: var(--amber); }

  .offer-banner {
    display: none;
    background: var(--amber-bg); border: 1px solid var(--amber);
    border-radius: 4px; padding: 12px 14px; margin-bottom: 24px;
    font-size: 14px;
  }
  .offer-banner .label {
    font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 12.5px;
    color: var(--amber); margin-bottom: 3px;
  }

  .cta {
    width: 100%; padding: 15px; margin-top: 8px;
    background: var(--primary); color: var(--primary-ink);
    border: none; border-radius: 4px;
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 15px;
    cursor: pointer;
  }
  .cta:active { opacity: 0.9; }
  .cta:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Locked / confirmation / expired screens — all share this shape so a
     dead link (expired) and a placed order (completed) both clearly read
     as "nothing to do here" rather than a broken interactive page. */
  .lock-screen { text-align: center; padding-top: 60px; }
  .lock-mark {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 24px;
  }
  .lock-mark.ok { background: var(--sage-bg); border: 1px solid var(--sage); color: var(--sage); }
  .lock-mark.gone { background: var(--amber-bg); border: 1px solid var(--amber); color: var(--amber); }
  .lock-screen h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;
    margin: 0 0 8px;
  }
  .lock-screen p { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .lock-screen .order-id {
    font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums;
    color: var(--ink-soft); font-size: 14px; margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="topbar">
      <span class="mark">Order</span>
      <span class="status" id="status"><span class="dot"></span><span id="status-text">connecting</span></span>
    </div>

    <div class="total-block">
      <div class="total-label">Running total</div>
      <div class="total-value" id="total">₹0</div>
    </div>

    <div class="offer-banner" id="offer-banner">
      <div class="label">Offer</div>
      <div id="offer-text"></div>
    </div>

    <h2 class="section">Your order</h2>
    <div class="ledger" id="cart"></div>

    <h2 class="section">Available products</h2>
    <div class="ledger" id="products"></div>

    <button class="cta" id="checkout-btn">Confirm order</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('s');
    const API_BASE = '';
    const PLACEHOLDER_THUMB = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42"><rect width="42" height="42" fill="#D7D2C4"/></svg>'
    );

    const socket = io(API_BASE, { query: { session_id: sessionId } });
    let cart = {};
    let products = [];
    let locked = false;
    let expiryTimer = null;

    function formatINR(n) {
      return '₹' + Number(n).toLocaleString('en-IN');
    }

    function cartTotal() {
      return Object.values(cart).reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function bumpTotal() {
      const el = document.getElementById('total');
      el.textContent = formatINR(cartTotal());
      el.classList.add('tally');
      setTimeout(() => el.classList.remove('tally'), 250);
    }

    function thumbTag(imageUrl) {
      const src = imageUrl || PLACEHOLDER_THUMB;
      return `<img class="thumb" src="${src}" onerror="this.src='${PLACEHOLDER_THUMB}'" alt="">`;
    }

    function renderCart() {
      const el = document.getElementById('cart');
      const entries = Object.entries(cart);
      el.innerHTML = entries.length
        ? entries.map(([sku, item]) => `
            <div class="row" id="cart-${sku}">
              <div class="row-media">
                ${thumbTag(item.image_url)}
                <div>
                  <div class="name">${item.product_name}</div>
                  <div class="meta">qty ${item.qty}</div>
                </div>
              </div>
              <div class="price">${formatINR(item.price * item.qty)}</div>
            </div>
          `).join('')
        : '<div class="row empty">Nothing added yet — items appear here as the agent talks you through your order.</div>';
    }

    function renderProducts() {
      const el = document.getElementById('products');
      el.innerHTML = products.length
        ? products.map((p) => `
            <div class="row" id="prod-${p.id}">
              <div class="row-media">
                ${thumbTag(p.image_url)}
                <div class="name">${p.name}</div>
              </div>
              <div class="price">${formatINR(p.price)}</div>
            </div>
          `).join('')
        : '<div class="row empty">No products loaded yet.</div>';
    }

    // Replaces the whole page with a non-interactive locked screen. Used for
    // both "order already placed" and "link expired" — after this point
    // there is nothing left to click.
    function showLockScreen({ kind, message, orderId }) {
      locked = true;
      if (expiryTimer) clearTimeout(expiryTimer);
      const isOk = kind === 'completed';
      document.getElementById('app').innerHTML = `
        <div class="lock-screen">
          <div class="lock-mark ${isOk ? 'ok' : 'gone'}">${isOk ? '&#10003;' : '&#10005;'}</div>
          <h1>${isOk ? 'Order confirmed' : 'This link is no longer active'}</h1>
          <p>${message}</p>
          ${orderId ? `<div class="order-id">${orderId}</div>` : ''}
        </div>
      `;
    }

    async function loadState() {
      const res = await fetch(`${API_BASE}/session/${sessionId}/state`);

      if (res.status === 404) {
        showLockScreen({ kind: 'expired', message: 'This session has expired or does not exist.' });
        return;
      }

      const state = await res.json();

      if (state.status === 'completed') {
        showLockScreen({
          kind: 'completed',
          message: 'This order has already been placed.',
          orderId: state.orderId,
        });
        return;
      }

      cart = state.cart || {};
      products = state.products || [];
      renderCart();
      renderProducts();
      bumpTotal();
      document.getElementById('status').classList.add('live');
      document.getElementById('status-text').textContent = 'live';

      // Auto-lock the UI the moment the session's own TTL runs out, rather
      // than waiting for the next click to fail against the backend.
      if (expiryTimer) clearTimeout(expiryTimer);
      if (state.expiresAt) {
        const msLeft = state.expiresAt - Date.now();
        if (msLeft <= 0) {
          showLockScreen({ kind: 'expired', message: 'This session has expired.' });
        } else {
          expiryTimer = setTimeout(() => {
            showLockScreen({ kind: 'expired', message: 'This session has expired.' });
          }, msLeft);
        }
      }
    }

    socket.on('connect', loadState);
    socket.on('disconnect', () => {
      if (locked) return;
      document.getElementById('status').classList.remove('live');
      document.getElementById('status-text').textContent = 'reconnecting';
    });

    socket.on('cart:update', (data) => {
      if (locked) return;
      cart = data.cart;
      renderCart();
      bumpTotal();
      const el = document.getElementById(`cart-${data.changed_sku}`);
      if (el) {
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 1200);
      }
    });

    socket.on('products:update', (data) => {
      if (locked) return;
      products = [...products, ...data.products];
      renderProducts();
    });

    socket.on('spotlight', (data) => {
      if (locked) return;
      const el = document.getElementById(`prod-${data.product_id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('spot');
        setTimeout(() => el.classList.remove('spot'), 1600);
      }
    });

    socket.on('offer:show', (data) => {
      if (locked) return;
      const banner = document.getElementById('offer-banner');
      document.getElementById('offer-text').textContent = `${data.offer.title} — ${data.offer.discount}`;
      banner.style.display = 'block';
    });

    socket.on('checkout:complete', (data) => {
      showLockScreen({
        kind: 'completed',
        message: 'This order has already been placed.',
        orderId: data.order_id,
      });
    });

    document.getElementById('checkout-btn').addEventListener('click', async (e) => {
      if (locked) return;
      e.target.disabled = true; // prevent double-submit while the request is in flight
      try {
        await fetch(`${API_BASE}/webhook/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
      } finally {
        // If it failed and we're not locked, let them try again.
        if (!locked) e.target.disabled = false;
      }
    });
  </script>
</body>
</html>
